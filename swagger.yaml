openapi: 3.0.3
info:
  title: DELACHE API
  version: 0.1.0
  description: Passwordless OTP auth and case operations API (Vercel serverless).
servers:
  - url: /
paths:
  /api/ping:
    get:
      summary: Health ping
      responses:
        "200":
          description: OK
  /api/config/app-version:
    get:
      summary: Current deployed app version (system_settings.app_version)
      responses:
        "200":
          description: Version string or null
  /api/auth/staff/request-otp:
    post:
      summary: Request staff portal login OTP
      responses:
        "200":
          description: Generic success
  /api/auth/staff/verify-otp:
    post:
      summary: Verify staff OTP and create session (actor=staff)
      responses:
        "200":
          description: Token + user
  /api/auth/staff/me:
    get:
      summary: Current staff user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/staff/logout:
    post:
      summary: Revoke staff session
      responses:
        "200":
          description: OK
  /api/auth/client/request-otp:
    post:
      summary: Request law-firm client portal login OTP
      responses:
        "200":
          description: Generic success
  /api/auth/client/verify-otp:
    post:
      summary: Verify client OTP and create session (actor=law_firm)
      responses:
        "200":
          description: Token + user
  /api/auth/client/me:
    get:
      summary: Current law-firm user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/client/logout:
    post:
      summary: Revoke client session
      responses:
        "200":
          description: OK
  /api/auth/request-otp:
    post:
      summary: Alias of /api/auth/staff/request-otp
      responses:
        "200":
          description: Generic success
  /api/auth/verify-otp:
    post:
      summary: Alias of /api/auth/staff/verify-otp
      responses:
        "200":
          description: Token + user
  /api/auth/me:
    get:
      summary: Alias of /api/auth/staff/me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/logout:
    post:
      summary: Alias of /api/auth/staff/logout
      responses:
        "200":
          description: OK
  /api/settings/case-number:
    get:
      summary: Case number format settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Format + preview
    put:
      summary: Update case number format
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /api/cases:
    get:
      summary: List cases (server-side filter, sort, pagination)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortDir
          schema: { type: string, enum: [ASC, DESC] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
      responses:
        "200":
          description: Cases + pagination
    post:
      summary: Create case
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/cases/{publicUuid}:
    get:
      summary: Case detail with history, notes, documents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detail payload
  /api/cases/{publicUuid}/status:
    patch:
      summary: Transition case status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
        "400":
          description: Invalid transition
  /api/cases/{publicUuid}/notes:
    post:
      summary: Add case note
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Note created
  /api/cases/{publicUuid}/documents:
    post:
      summary: Upload case document to Vercel Blob
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Document created
        "503":
          description: Blob token missing
  /api/cases/{publicUuid}/assignments:
    post:
      summary: Assign team member to case
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Assignment created/reactivated
  /api/cases/{publicUuid}/assignments/{assignmentId}:
    delete:
      summary: Soft-unassign case member
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unassigned
  /api/cases/{publicUuid}/questionnaires:
    post:
      summary: Create questionnaire (draft or submitted)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Questionnaire created
  /api/cases/{publicUuid}/inspections:
    post:
      summary: Schedule inspection
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Inspection created
  /api/cases/{publicUuid}/measurements:
    post:
      summary: Record field measurement
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Measurement created
  /api/cases/{publicUuid}/trips:
    post:
      summary: Create logistics trip
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Trip created
  /api/cases/{publicUuid}/expenses:
    post:
      summary: Add logistics expense to a trip
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Expense created
  /api/cases/{publicUuid}/technical-reports:
    post:
      summary: Create technical report
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Report created
  /api/cases/{publicUuid}/technical-reports/{reportUuid}/status:
    patch:
      summary: Advance technical report review status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Report updated
  /api/notifications:
    get:
      summary: List current user notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications + unreadCount
  /api/notifications/read-all:
    post:
      summary: Mark all notifications read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/notifications/{publicUuid}/read:
    post:
      summary: Mark one notification read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/law-firms:
    get:
      summary: List law firms (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Law firms
    post:
      summary: Create law firm (admin)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/client/cases:
    get:
      summary: Law firm portal — list own cases
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cases
    post:
      summary: Law firm portal — submit new case
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/client/cases/{publicUuid}:
    get:
      summary: Law firm portal — case detail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Case + shared notes/docs/reports
  /api/client/cases/{publicUuid}/documents:
    post:
      summary: Law firm portal — upload document
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Document uploaded
  /api/dashboard/stats:
    get:
      summary: Dashboard counters
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stats
  /api/calendar/events:
    get:
      summary: Calendar events
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: Inclusive range start (ISO). Optional with `to`.
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: Inclusive range end (ISO). Optional with `from`.
      responses:
        "200":
          description: Events list
    post:
      summary: Create calendar event
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Event created
  /api/finance/invoices:
    get:
      summary: Invoices list (server-side filter, sort, pagination)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortDir
          schema: { type: string, enum: [ASC, DESC] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Invoices + pagination
    post:
      summary: Create invoice
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Invoice created
  /api/finance/invoices/{publicUuid}/payments:
    post:
      summary: Record payment against invoice
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Payment recorded
  /api/team/members:
    get:
      summary: Team members (server-side filter, sort, pagination)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortDir
          schema: { type: string, enum: [ASC, DESC] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Members + pagination
    post:
      summary: Invite team member
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Member invited
        "409":
          description: Email already exists
  /api/uploads:
    post:
      summary: Generic Blob upload
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Uploaded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

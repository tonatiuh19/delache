openapi: 3.0.3
info:
  title: DELACHE API
  version: 0.1.0
  description: Passwordless OTP auth and case operations API (Vercel serverless).
servers:
  - url: /
paths:
  /api/ping:
    get:
      summary: Health ping
      responses:
        "200":
          description: OK
  /api/config/app-version:
    get:
      summary: Current deployed app version (system_settings.app_version)
      responses:
        "200":
          description: Version string or null
  /api/auth/staff/request-otp:
    post:
      summary: Request staff portal login OTP
      responses:
        "200":
          description: Code emailed (sent=true)
        "404":
          description: Account not found, inactive, or login not allowed
        "429":
          description: Too many OTP requests (durable email+IP rate limits)
        "502":
          description: Email provider failed
  /api/auth/staff/verify-otp:
    post:
      summary: Verify staff OTP and create session (actor=staff)
      responses:
        "200":
          description: Token + user
  /api/auth/staff/me:
    get:
      summary: Current staff user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/staff/preferences:
    patch:
      summary: Update current staff user preferences (process guidance / legacy helpers)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                showProcessGuidance:
                  type: boolean
                  description: Show process coaching panel on case detail (default false)
                showFormHelpers:
                  type: boolean
                  description: Legacy form tip helpers flag (default false; tips removed from UI)
      responses:
        "200":
          description: Updated user profile
        "400":
          description: Invalid body
  /api/auth/staff/logout:
    post:
      summary: Revoke staff session
      responses:
        "200":
          description: OK
  /api/auth/client/request-otp:
    post:
      summary: Request law-firm login OTP
      responses:
        "200":
          description: Code emailed (sent=true)
        "404":
          description: Account not found or inactive
        "429":
          description: Too many OTP requests (rate limited)
        "502":
          description: Email provider failed
  /api/auth/client/verify-otp:
    post:
      summary: Verify client OTP and create session (actor=law_firm)
      responses:
        "200":
          description: Token + user
  /api/auth/client/me:
    get:
      summary: Current law-firm user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/client/preferences:
    patch:
      summary: Update current law-firm user preferences (process guidance / legacy helpers)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                showProcessGuidance:
                  type: boolean
                  description: Show process coaching panel on case detail (default false)
                showFormHelpers:
                  type: boolean
                  description: Legacy form tip helpers flag (default false; tips removed from UI)
      responses:
        "200":
          description: Updated user profile
        "400":
          description: Invalid body
  /api/auth/client/logout:
    post:
      summary: Revoke client session
      responses:
        "200":
          description: OK
  /api/auth/request-otp:
    post:
      summary: Unified OTP request (staff first, then law_firm; single rate-limit bucket)
      description: |
        Resolves the email against staff_users, then law_firm_users on account_not_found.
        Returns `actor` so the client can call the matching verify endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                locale:
                  type: string
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sent:
                    type: boolean
                  message:
                    type: string
                  actor:
                    type: string
                    enum: [staff, law_firm]
        "404":
          description: Account not found / inactive / not allowed
        "429":
          description: Rate limited
  /api/auth/verify-otp:
    post:
      summary: Alias of /api/auth/staff/verify-otp
      responses:
        "200":
          description: Token + user
  /api/auth/me:
    get:
      summary: Alias of /api/auth/staff/me
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
  /api/auth/logout:
    post:
      summary: Alias of /api/auth/staff/logout
      responses:
        "200":
          description: OK
  /api/settings/case-number:
    get:
      summary: Case number format settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Format + preview
    put:
      summary: Update case number format
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated
  /api/cases:
    get:
      summary: List cases (staff visibility or law-firm own cases)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortDir
          schema: { type: string, enum: [ASC, DESC] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
      responses:
        "200":
          description: Cases + pagination. Each case includes listado progress flags (including gatesOk for the current process point), lawFirmName, primaryExpertName, and activeAssignments (role + name for ownership badges). Search (q) matches number, title, court, city, firm, or primary expert.
    post:
      summary: Create case (staff or law firm)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created
  /api/cases/pipeline:
    get:
      summary: Cases pipeline board (staff only; per-status columns with pagination)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
          description: When set, only loads that status column
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: column
          schema: { type: string }
          description: Load-more target status
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: >
            Column map or single-column page when column+offset provided.
            Each case includes listado progress flags (including gatesOk and
            holdResumeStatus for on_hold cases) used by the board to lock gated
            forward drops.
  /api/cases/{publicUuid}:
    get:
      summary: Case detail (staff full payload; law firm limited notes/docs/reports + listado)
      description: |
        Role-scoped payload. `invoices` is included only for admin and accountant (`finance` section). `case.listado` mirrors pipeline progress
        flags (including `documentsHandoffConfirmedAt`, `ratificationScheduledAt`, and
        `gatesOk` for the current process point).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Role-scoped case detail payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetailResponse"
        "404":
          description: Case not found
    patch:
      summary: Update case flags — staff: full pack; law firm: involvesFatality only
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                involvesFatality:
                  type: boolean
                protestaModality:
                  type: string
                  nullable: true
                  enum: [presencial, virtual]
                  description: P6 protesta path; clock starts on artifact upload, not modality alone
                externalCourtDeadlineAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional external court plazo; null clears (process SLAs only when unset)
                dictamenDueAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: Field-ops date the technical report must be finished; null clears. Required before leaving logistics.
                title:
                  type: string
                  maxLength: 255
                  description: Paso 1 folio. Staff with document access.
                description:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: Paso 1 note. Empty clears.
                lawFirmId:
                  type: integer
                  nullable: true
                  description: Despacho that owns the expediente. Staff with document access. Null clears. Unknown id returns 400.
      responses:
        "200":
          description: Updated case
        "400":
          description: Invalid body
        "403":
          description: Insufficient permissions for the requested flag
        "404":
          description: Case not found
  /api/cases/{publicUuid}/location:
    patch:
      summary: Update case property address and GPS coordinates (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyAddress: { type: string, nullable: true }
                propertyCity: { type: string, nullable: true }
                propertyState: { type: string, nullable: true }
                propertyPostalCode: { type: string, nullable: true }
                propertyCountry: { type: string, nullable: true }
                propertyLat: { type: number, nullable: true }
                propertyLng: { type: number, nullable: true }
      responses:
        "200":
          description: Updated case
        "400":
          description: Invalid coordinates
        "403":
          description: Insufficient permissions
        "404":
          description: Case not found
  /api/geo/geocode:
    post:
      summary: Geocode an address or lat,lng text (staff only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  description: Address text or "lat,lng"
      responses:
        "200":
          description: lat/lng and displayName
        "400":
          description: Query too short
        "404":
          description: No results
        "502":
          description: Upstream geocoder failure
  /api/cases/{publicUuid}/status:
    patch:
      summary: Transition case status (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated case
        "400":
          description: Invalid transition
        "409":
          description: Process gates not satisfied (missing artifacts / approvals)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missing:
                    type: array
                    items:
                      type: string
  /api/cases/{publicUuid}/notes:
    post:
      summary: Add case note (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Note created
  /api/cases/{publicUuid}/documents:
    post:
      summary: Upload case document (staff or owning law firm; firm limited to intake/additional categories)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Document created (includes ocrStatus/ocrText when extracted). category is required (lawsuit, protesta, …).
        "400":
          description: Missing or invalid category
        "503":
          description: Blob token missing
  /api/cases/{publicUuid}/documents/from-blob:
    post:
      summary: Register a case document already uploaded to private Vercel Blob (staff or owning law firm)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, storageKey, fileSizeBytes]
              properties:
                title: { type: string }
                category: { type: string }
                fileName: { type: string }
                contentType: { type: string }
                storageKey: { type: string }
                fileSizeBytes: { type: number }
      responses:
        "201":
          description: Document created from an existing blob
        "400":
          description: Invalid blob metadata or pathname
        "503":
          description: Blob token missing
  /api/cases/{publicUuid}/documents/{documentUuid}:
    patch:
      summary: Recategorize a case document (staff or owning law firm; firm locked after approval)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: documentUuid
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string }
      responses:
        "200":
          description: Document with updated category
        "400":
          description: Invalid category
  /api/cases/{publicUuid}/documents/bulk:
    post:
      summary: Bulk upload case documents (staff only; max 20; PDF OCR on upload)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [fileName, data]
                    properties:
                      title: { type: string }
                      fileName: { type: string }
                      contentType: { type: string }
                      data: { type: string, description: Base64 file bytes }
                      category: { type: string }
      responses:
        "201":
          description: Documents created
        "400":
          description: Validation failed
        "503":
          description: Blob token missing
  /api/cases/{publicUuid}/documents/{documentUuid}/ocr:
    post:
      summary: Run or save OCR for a document version (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: documentUuid
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ocrText: { type: string, description: Client Tesseract text }
                ocrStatus: { type: string, enum: [pending, processing, completed, failed, skipped] }
      responses:
        "200":
          description: Document with updated OCR fields
        "400":
          description: Image OCR requires ocrText body, or type not eligible
        "404":
          description: Document not found
  /api/cases/{publicUuid}/assignments:
    post:
      summary: Assign team member to case (staff only)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId, assignmentRole]
              properties:
                userId:
                  type: integer
                assignmentRole:
                  type: string
                isPrimary:
                  type: boolean
                notes:
                  type: string
                deliveryDueAt:
                  type: string
                  description: Optional YYYY-MM-DD or ISO date for primary expert delivery (creates expert_delivery deadline + notifies expert)
      responses:
        "201":
          description: Assignment created/reactivated
  /api/cases/{publicUuid}/expert-delivery-deadline:
    patch:
      summary: Set or clear primary expert delivery deadline (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryDueAt:
                  type: string
                  nullable: true
                  description: YYYY-MM-DD or ISO; null/omit to clear (notifies expert when cleared)
      responses:
        "200":
          description: Updated deadline or cleared
        "409":
          description: No primary expert assigned
  /api/cases/{publicUuid}/assignments/{assignmentId}:
    delete:
      summary: Soft-unassign case member (staff only)
      description: >
        Unassigning the primary expert also clears expert_delivery deadline,
        linked calendar events, and notifies the expert when a delivery date existed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Unassigned
  /api/cases/{publicUuid}/handoff/confirm:
    post:
      summary: Confirm P2 document handoff to primary expert (staff only)
      description: Coordinator confirms intake documents reached the assigned expert intact.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Handoff confirmed
        "403":
          description: Not allowed for role
  /api/cases/{publicUuid}/documents/{documentUuid}/approve:
    post:
      summary: Approve an intake document (staff admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Document approved
        "403":
          description: Not allowed for role
        "409":
          description: Document not in an approvable status
  /api/cases/{publicUuid}/documents/{documentUuid}/reject:
    post:
      summary: Reject document / request correction (staff admin)
      description: |
        Sets status=rejected, clears expediente approval, and opens a 3-business-day
        intake_correction deadline when the category is an intake requirement.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Correction requested
        "403":
          description: Not allowed for role
        "409":
          description: Document not rejectable
  /api/cases/{publicUuid}/expediente/approve:
    post:
      summary: Approve expediente package (staff admin)
      description: Requires all four intake document categories to be approved.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Expediente approved
        "400":
          description: Intake documents not all approved
        "403":
          description: Not allowed for role
        "409":
          description: Already approved
  /api/cases/{publicUuid}/ratification-scheduled:
    patch:
      summary: Set or clear ratification hearing schedule (staff only)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ratificationScheduledAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "200":
          description: Ratification schedule updated
  /api/cases/{publicUuid}/questionnaires:
    post:
      summary: Create questionnaire (staff only)
      description: |
        Submit (`submit: true`) requires an active `questionnaire` document (Miro PDF)
        plus Street View URL and preexistence on `contentJson`.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Questionnaire created
        "400":
          description: Missing defendant questionnaire PDF or Street View fields
        "409":
          description: Questionnaire is in legal_review or another non-editable status
  /api/cases/{publicUuid}/questionnaires/{questionnaireUuid}/status:
    patch:
      summary: Transition questionnaire status (staff only)
      description: |
        Direct status PATCH cannot move `grammar_qa → legal_review` or
        `legal_review → approved`; those transitions require completing the matching
        review request via `/reviews/{reviewId}/complete`.
        Transitioning to `grammar_qa` requires the same PDF + Street View checks as submit.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: questionnaireUuid
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Questionnaire updated
        "400":
          description: Invalid transition, or missing PDF / Street View when entering grammar_qa
  /api/cases/{publicUuid}/reviews/{reviewId}/complete:
    post:
      summary: Complete a pending review request (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Review completed with entity side effects
        "400":
          description: Not pending or invalid outcome
  /api/cases/{publicUuid}/inspections:
    post:
      summary: Schedule inspection (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Inspection created
  /api/cases/{publicUuid}/inspections/{inspectionUuid}/status:
    patch:
      summary: Update inspection status (staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: inspectionUuid
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Inspection updated
        "400":
          description: Invalid status or soft_parallel_blocked (complete only during field_ops, or on_hold resume from field_ops)
  /api/cases/{publicUuid}/measurements:
    post:
      summary: Record field measurement (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Measurement created
  /api/cases/{publicUuid}/evidence:
    post:
      summary: Capture field evidence (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Evidence created with updated checklist coverage
        "400":
          description: Validation error or soft_parallel_blocked (field evidence only during field_ops, or on_hold resume from field_ops)
  /api/cases/{publicUuid}/evidence/{evidenceUuid}:
    delete:
      summary: Soft-delete field evidence (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Evidence deleted with updated checklist coverage
        "404":
          description: Evidence or case not found
  /api/cases/{publicUuid}/trips:
    post:
      summary: Create logistics trip (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Trip created
        "400":
          description: soft_parallel_blocked outside assignment→field_ops (or on_hold resume outside that window)
        "403":
          description: Insufficient permissions
  /api/cases/{publicUuid}/expenses:
    post:
      summary: Add logistics expense to a trip (staff only)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Expense created
  /api/cases/{publicUuid}/technical-reports:
    post:
      summary: Create technical report (staff only)
      description: |
        Submit (`submit: true`) requires an active `technical_report` document (Miro dictamen PDF).
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Report created
        "400":
          description: Technical report PDF required when submitting
  /api/cases/{publicUuid}/technical-reports/{reportUuid}/status:
    patch:
      summary: Advance technical report review status (staff only; law firm uses /review)
      description: |
        Transitioning to `grammar_qa` requires an active `technical_report` document.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Report updated
        "400":
          description: Invalid transition or missing technical report PDF
  /api/notifications:
    get:
      summary: List current user notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications + unreadCount
  /api/notifications/read-all:
    post:
      summary: Mark all notifications read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/notifications/{publicUuid}/read:
    post:
      summary: Mark one notification read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
  /api/team/members:
    get:
      summary: List team members (admin) — staff or despacho roster
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: roster
          schema: { type: string, enum: [staff, firm], default: staff }
          description: staff = DELACHE users; firm = law_firm_users with firm name
      responses:
        "200":
          description: Roster page (firm roster includes memberRole + lawFirmName)
    post:
      summary: Invite staff or despacho user (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, role]
              properties:
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                role:
                  type: string
                  enum: [admin, expert, legal, logistics, accountant, law_firm_user]
                lawFirmId: { type: integer, nullable: true }
                createLawFirm:
                  type: object
                  properties:
                    name: { type: string }
                    city: { type: string }
                    state: { type: string }
                    defaultCourtName: { type: string }
                memberRole:
                  type: string
                  enum: [owner, admin, member, viewer]
      responses:
        "201":
          description: Invited
        "400":
          description: Invalid payload
        "409":
          description: Email actor conflict or already registered
  /api/law-firms:
    get:
      summary: List law firms (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Law firms
    post:
      summary: Create law firm with primary owner invite (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerEmail, ownerFirstName, ownerLastName]
              properties:
                name: { type: string }
                ownerEmail: { type: string }
                ownerFirstName: { type: string }
                ownerLastName: { type: string }
                email: { type: string }
                city: { type: string }
                state: { type: string }
                defaultCourtName: { type: string }
      responses:
        "201":
          description: Created firm + invited owner
        "400":
          description: Missing name or owner identity
        "409":
          description: Email already used by staff or despacho user
  /api/firm/members:
    get:
      summary: List members of the caller's despacho
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Firm roster + canManage + memberRole on auth/me for UI gates
        "401":
          description: Unauthorized
        "403":
          description: No firm membership
    post:
      summary: Invite a colleague to the caller's despacho (owner/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName]
              properties:
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                memberRole:
                  type: string
                  enum: [admin, member, viewer]
      responses:
        "201":
          description: Invited
        "400":
          description: Invalid payload or memberRole
        "403":
          description: Not firm owner/admin
        "409":
          description: Email actor conflict
  /api/cases/{publicUuid}/technical-reports/{reportUuid}/review:
    post:
      summary: Law firm — complete external technical report review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: publicUuid
          required: true
          schema: { type: string }
        - in: path
          name: reportUuid
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report updated. changes_requested returns the case to P9; rejected holds the case.
        "400":
          description: Invalid outcome or report not in external_review
        "404":
          description: Case or report not found

  /api/blob/client-upload:
    post:
      summary: Issue a client token for direct private Blob uploads
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Client token for browser→Blob upload
        "400":
          description: Invalid pathname or payload
        "503":
          description: Blob token missing
  /api/uploads:
    post:
      summary: Generic Blob upload
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Uploaded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PendingReviewQueueItem:
      type: object
      properties:
        id: { type: integer }
        caseId: { type: integer }
        reviewStage: { type: string }
        entityType: { type: string }
        status: { type: string }
        casePublicUuid: { type: string }
        caseNumber: { type: string }
        caseTitle: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
    PendingReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/PendingReviewQueueItem"
        total: { type: integer }
    ListadoProgress:
      type: object
      description: Pipeline progress flags for kanban and case finance panel
      properties:
        processPoint: { type: integer, nullable: true }
        gatesOk: { type: boolean }
        holdResumeStatus: { type: string, nullable: true }
        primaryExpert: { type: boolean }
        intakeComplete: { type: boolean }
        questionnaireApproved: { type: boolean }
        streetViewDone: { type: boolean }
        advanceReleased: { type: boolean }
        advancePaid: { type: boolean }
        plaintiffQuestionnaire: { type: boolean }
        protestaFiled: { type: boolean }
        clock10DueAt: { type: string, format: date-time, nullable: true }
        logisticsReady: { type: boolean }
        inspectionComplete: { type: boolean }
        reportInternalOk: { type: boolean }
        reportFirmOk: { type: boolean }
        ratified: { type: boolean }
        attendedWithReport: { type: boolean }
        finalReleased: { type: boolean }
        finalPaid: { type: boolean }
    CaseProcessGateSnapshot:
      type: object
      properties:
        point: { type: integer, nullable: true }
        ok: { type: boolean }
        missing:
          type: array
          items: { type: string }
    CaseDetail:
      type: object
      properties:
        publicUuid: { type: string }
        caseNumber: { type: string }
        title: { type: string }
        status: { type: string }
        documentsHandoffConfirmedAt:
          { type: string, format: date-time, nullable: true }
        ratificationScheduledAt:
          { type: string, format: date-time, nullable: true }
        protestaModality:
          type: string
          nullable: true
          enum: [presencial, virtual]
        dictamenDueAt:
          type: string
          format: date-time
          nullable: true
        listado:
          $ref: "#/components/schemas/ListadoProgress"
    InvoiceSummary:
      type: object
      properties:
        publicUuid: { type: string }
        invoiceType: { type: string, enum: [advance, final, other] }
        status: { type: string }
        amountCents: { type: integer }
        currency: { type: string }
    CaseDetailResponse:
      type: object
      description: |
        Staff case detail. `invoices` is empty unless the viewer has finance
        section access (admin, accountant).
      properties:
        case:
          $ref: "#/components/schemas/CaseDetail"
        hasUnpaidInvoices: { type: boolean }
        processGate:
          $ref: "#/components/schemas/CaseProcessGateSnapshot"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceSummary"
        allowedNextStatuses:
          type: array
          items: { type: string }
